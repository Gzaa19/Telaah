# Declarative Section and Sub-Field Configuration for iciCos IEEE Conference Template
# This file serves as the Single Source of Truth for outline section fields alongside the DOCX template.

template_id: "icicos"
name: "iciCos IEEE Conference Template"
target_venue: "International Conference on Informatics and Computational Sciences"
version: "1.0.0"

sections:
  - key: "abstract"
    title: "Abstract"
    is_required: true
    order: 1
    fields:
      - key: "abstract_text"
        label: "Abstract"
        guidance: "Summarize the paper in 150–250 words covering problem, method, results, and conclusion."
        order: 1

  - key: "keywords"
    title: "Index Terms / Keywords"
    is_required: true
    order: 2
    fields:
      - key: "keywords_list"
        label: "Keywords"
        guidance: "List 4–6 IEEE-style index terms."
        order: 1

  - key: "introduction"
    title: "I. INTRODUCTION"
    is_required: true
    order: 3
    fields:
      - key: "background"
        label: "Background"
        guidance: "Situate the research in its broader academic context (1–3 sentences)."
        order: 1
      - key: "problem_statement"
        label: "Problem Statement"
        guidance: "State the specific problem or research gap addressed (1–2 sentences)."
        order: 2
      - key: "research_gap"
        label: "Research Gap"
        guidance: "Identify what prior work has not addressed (1–2 sentences)."
        order: 3
      - key: "objective"
        label: "Objective"
        guidance: "State the research objective or contribution (1–2 sentences)."
        order: 4

  - key: "related_work"
    title: "II. RELATED WORK"
    is_required: true
    order: 4
    fields:
      - key: "prior_approaches"
        label: "Prior Approaches"
        guidance: "Summarize key prior methods or systems (1–3 sentences)."
        order: 1
      - key: "limitations"
        label: "Limitations of Prior Work"
        guidance: "Identify gaps or weaknesses in prior work that motivate this paper (1–2 sentences)."
        order: 2

  - key: "methodology"
    title: "III. METHODOLOGY"
    is_required: true
    order: 5
    fields:
      - key: "dataset_materials"
        label: "Dataset / Materials"
        guidance: "Describe datasets, tools, or experimental materials used (1–2 sentences)."
        order: 1
      - key: "proposed_method"
        label: "Proposed Method"
        guidance: "Describe the proposed approach, algorithm, or system architecture (2–3 sentences)."
        order: 2
      - key: "evaluation_metrics"
        label: "Evaluation Metrics"
        guidance: "State evaluation criteria or metrics used (1–2 sentences)."
        order: 3

  - key: "results"
    title: "IV. RESULTS AND DISCUSSION"
    is_required: true
    order: 6
    fields:
      - key: "key_findings"
        label: "Key Findings"
        guidance: "Summarize primary experimental results or observations (1–3 sentences)."
        order: 1
      - key: "comparison"
        label: "Comparison with Baseline / Prior Work"
        guidance: "Compare results with baseline or related methods (1–2 sentences)."
        order: 2

  - key: "conclusion"
    title: "V. CONCLUSION"
    is_required: true
    order: 7
    fields:
      - key: "summary"
        label: "Summary"
        guidance: "Concisely state what was achieved in this work (1–2 sentences)."
        order: 1
      - key: "future_work"
        label: "Future Work"
        guidance: "State planned or suggested future research directions (1–2 sentences)."
        order: 2

  - key: "acknowledgment"
    title: "Acknowledgment"
    is_required: false
    order: 8
    fields:
      - key: "funding_sponsor"
        label: "Sponsor / Grant Support"
        guidance: "Identify financial support and research grant details if applicable."
        order: 1

  - key: "references"
    title: "References"
    is_required: true
    order: 9
    fields:
      - key: "key_references"
        label: "Primary References"
        guidance: "List key cited publications directly extracted from the source document."
        order: 1
